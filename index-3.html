<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaizen Hub — SMK Mitra Industri 03</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#243b53}nav{background:#fff;padding:15px 6%;display:flex;justify-content:space-between;position:sticky;top:0;z-index:3;box-shadow:0 1px 8px #0001}.brand{font-weight:800;color:#102a43;font-size:20px}nav button{border:0;background:none;padding:9px;font-weight:700;cursor:pointer;color:#243b53}.wrap{max-width:1100px;margin:auto;padding:30px 5%}.hero{background:linear-gradient(135deg,#102a43,#1976d2);color:white;padding:45px;border-radius:22px}.hero h1{font-size:44px;line-height:1.05;margin:10px 0}.btn{padding:12px 18px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin:5px}.primary{background:#fff;color:#1976d2}.blue{background:#1976d2;color:#fff}.pages section{display:none}.pages .show{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.card{background:white;border-radius:14px;padding:20px;box-shadow:0 4px 15px #0000000b}.big{font-size:30px;font-weight:800;display:block;margin-top:8px}input,select,textarea{width:100%;padding:11px;margin:6px 0 13px;border:1px solid #d9e2ec;border-radius:8px;font:inherit}textarea{min-height:100px}label{font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.status{padding:5px 9px;border-radius:99px;font-weight:800;font-size:12px}.open{background:#fee2e2;color:#b91c1c}.prog{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}}@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style></head><body>
<nav><div class="brand">KAIZEN HUB <span style="color:#1976d2">SMK MI 03</span></div><div><button onclick="page('home')">Home</button><button onclick="page('report')">Lapor</button><button onclick="page('track')">Tracking</button><button onclick="page('dash')">Dashboard</button></div></nav>
<div class="pages">
<section id="home" class="show"><div class="wrap"><div class="hero"><small>SMK MITRA INDUSTRI 03</small><h1>SCAN IT.<br>REPORT IT.<br>FIX IT.</h1><p>Satu ide kecil bisa membawa perubahan besar.</p><button class="btn primary" onclick="page('report')">🚨 Laporkan Masalah</button><button class="btn primary" onclick="page('report')">💡 Ajukan Ide</button></div><div class="cards"><div class="card">TOTAL<b id="t" class="big">-</b></div><div class="card">OPEN<b id="o" class="big">-</b></div><div class="card">PROGRESS<b id="p" class="big">-</b></div><div class="card">DONE<b id="d" class="big">-</b></div></div></div></section>
<section id="report"><div class="wrap"><h2>🚨 Laporan / Ide Kaizen</h2><div class="card"><form id="form"><label>Nama<input name="name" required></label><label>Kelas<input name="kelas" required></label><label>Jenis<select name="jenis"><option>Laporan Masalah</option><option>Ide Kaizen</option></select></label><label>Lokasi<input name="lokasi" required></label><label>Kategori<select name="kategori"><option>Safety</option><option>Bengkel</option><option>Fasilitas</option><option>Kebersihan</option><option>Kelistrikan</option><option>Pembelajaran</option><option>Efisiensi</option><option>Lingkungan</option><option>Lainnya</option></select></label><label>Prioritas<select name="prioritas"><option>Darurat</option><option>Mendesak</option><option>Tidak Mendesak</option></select></label><label>Deskripsi<textarea name="deskripsi" required></textarea></label><label>Usulan Solusi<textarea name="solusi"></textarea></label><button class="btn blue">Kirim 🚀</button></form><p id="msg"></p></div></div></section>
<section id="track"><div class="wrap"><h2>🔎 Tracking Laporan</h2><div class="card"><input id="qid" placeholder="KZN-2026-0001"><button class="btn blue" onclick="track()">Cari</button><div id="result"></div></div></div></section>
<section id="dash"><div class="wrap"><h2>📊 Dashboard Real-time</h2><div class="cards"><div class="card">TOTAL<b id="dt" class="big">-</b></div><div class="card">OPEN<b id="do" class="big">-</b></div><div class="card">PROGRESS<b id="dp" class="big">-</b></div><div class="card">DONE<b id="dd" class="big">-</b></div></div><div class="grid"><div class="card"><h3>Completion Rate</h3><b id="rate" class="big">-</b></div><div class="card"><h3>Total Poin</h3><b id="points" class="big">-</b></div></div></div></section></div>
<script>
const CONFIG={apiUrl:"PASTE_WEB_APP_URL_DI_SINI"};
function page(id){document.querySelectorAll('.pages section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');if(id==='home'||id==='dash')loadDash();scrollTo(0,0)}
async function api(body){if(CONFIG.apiUrl.startsWith('PASTE'))throw new Error('API URL belum dipasang');const r=await fetch(CONFIG.apiUrl,{method:'POST',body:JSON.stringify(body)});return r.json()}
form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));msg.textContent='Mengirim...';try{const r=await api({action:'submit',...d});msg.textContent=r.ok?'Berhasil! Nomor laporan: '+r.id:r.error;if(r.ok)form.reset()}catch(x){msg.textContent=x.message}}
async function track(){try{const r=await api({action:'track',id:qid.value});result.innerHTML=r.ok?`<p><b>${r.id}</b></p><p>${r.name} • ${r.kelas}</p><p>${r.lokasi} • ${r.kategori}</p><p><span class="status ${r.status==='DONE'?'done':r.status==='ON PROGRESS'?'prog':'open'}">${r.status}</span></p>`:'<p>'+r.error+'</p>'}catch(x){result.textContent=x.message}}
async function loadDash(){try{const r=await api({action:'dashboard'});if(!r.ok)return;t.textContent=dt.textContent=r.total;o.textContent=do_.textContent=r.open;p.textContent=dp.textContent=r.progress;d.textContent=dd.textContent=r.done;rate.textContent=Math.round(r.completionRate*100)+'%';points.textContent=r.totalPoints}catch(e){}}
const do_=document.getElementById('do');loadDash();
</script></body></html>
